<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service Advisor Assistant - Test UI</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; }
      textarea { width: 100%; height: 120px; }
      button { padding: 0.5rem 1rem; }
      #output { margin-top: 1rem; padding: 1rem; border: 1px solid #eee; background: #fafafa; }
    </style>
  </head>
  <body>
    <h1>Service Advisor Assistant - Test UI</h1>
    <form id="complaintForm">
      <label for="complaint">Customer complaint:</label><br/>
      <textarea id="complaint" name="complaint" placeholder="e.g. The car makes a grinding noise when braking"></textarea><br/>
      <button type="submit">Analyze</button>
    </form>

    <div id="output"></div>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
